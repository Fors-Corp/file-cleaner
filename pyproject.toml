[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filecleaner"
version = "0.1.0"
description = "Local-only, privacy-preserving disk cleanup tool with a quarantine-based backup system"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "textual>=0.58",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Experimental, unverified: iOS device management over USB (`fclean device ...`).
# Kept optional since it pulls a heavy dependency tree for a feature that
# could not be tested end-to-end without a physical iPhone/iPad connected.
device = ["pymobiledevice3>=4.0"]

[project.scripts]
fclean = "filecleaner.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
