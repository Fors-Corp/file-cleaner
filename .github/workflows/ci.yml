name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # filecleaner is macOS-only (Library/Caches conventions, /Volumes,
    # fdesetup, MobileSync backups) — there is no Linux/Windows target to
    # test against.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package with dev + device dependencies
        # `device` is optional for end users installing the packaged CLI
        # (it pulls in pymobiledevice3, a heavy dependency tree for a
        # feature most installs never touch) but tests/test_device.py
        # deliberately exercises the real library end-to-end against "no
        # device connected", so it's needed here.
        run: python -m pip install -e ".[dev,device]"

      - name: Native scan walker (Rust) — unit tests and release build
        # The optional accelerator in native/fclean-walk. Built before pytest
        # so tests/test_native_walk.py runs it against the Python walker
        # instead of skipping.
        run: |
          cargo test --release --manifest-path native/fclean-walk/Cargo.toml
          cargo build --release --manifest-path native/fclean-walk/Cargo.toml

      - name: Ruff (lint)
        run: ruff check src/ tests/

      - name: mypy (type check)
        run: mypy src/filecleaner

      - name: pytest
        # No helper is bundled here, so the suite as a whole exercises the
        # Python walker — the reference implementation and the fallback.
        run: pytest --cov-report=xml

      - name: pytest — scanning suites again, through the native walker
        run: >
          FCLEAN_NATIVE_WALK="$PWD/native/fclean-walk/target/release/fclean-walk"
          pytest --no-cov tests/test_scanner.py tests/test_native_walk.py tests/test_tui.py tests/test_cli.py

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
